[[stack]]
name = "radicale"
tags = ["personal"]
[stack.config]
server = "hyperion"
links = [
  "https://radicale.jekotia.net",
  "https://github.com/Kozea/Radicale",
  "https://github.com/kozea/radicale/pkgs/container/radicale"
]
git_account = "jekotia"
repo = "jekotia/saturn"
branch = "master"
webhook_enabled = false
run_directory = "docker/stacks/radicale/"
file_paths = [
  "compose.yaml",
  "../../networks/proxy_private.yaml"
]
environment = """
TIMEZONE=[[TIMEZONE]]

# RADICALE_URL_PREFIX=
NETWORK_DOMAIN=[[NETWORK_DOMAIN]]

# UID=
# GID=
"""