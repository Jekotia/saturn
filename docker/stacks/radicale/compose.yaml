include:
  - ../../networks/proxy_private.yaml

name: Radicale
services:
  radicale:
    image: ghcr.io/kozea/radicale:3.8.3
    container_name: radicale
    restart: unless-stopped
    networks:
      - proxy_private
    # ports:
    # - 5232:5232
    volumes:
      - /srv/application_data/radicale/app/config:/etc/radicale
      - /srv/application_data/radicale/app/data:/var/lib/radicale
    labels:
      # Glance
      glance.name: Radicale
      glance.icon: sh:radicale
      glance.url: https://${RADICALE_URL_PREFIX:-radicale.}${NETWORK_DOMAIN}
      glance.description: CalDAV & CardDAV server
      glance.category: personal
      # What's Up Docker
      wud.watch: true
      wud.watch.digest: false
      wud.display.icon: sh:radicale
      wud.tag.include: ^\d+\.\d+\.\d+$$
      # Traefik
      traefik.enable: "true"
      # Traefik, Router
      traefik.http.routers.radicale.entrypoints: websecure
      traefik.http.routers.radicale.rule: Host(`${RADICALE_URL_PREFIX:-radicale.}${NETWORK_DOMAIN}`)
      traefik.http.routers.radicale.tls.certresolver: dns-cloudflare
      # Traefik, Services
      traefik.http.routers.radicale.service: radicale
      traefik.http.services.radicale.loadbalancer.server.port: 5232
