[[stack]]
name = "radarr"
tags = [
  "media-management",
  "smb-mounts"
]
[stack.config]
server = "hyperion"
links = [
  "https://radarr.jekotia.net",
  "https://github.com/linuxserver/docker-radarr",
  "https://github.com/linuxserver/docker-radarr/pkgs/container/radarr"
]
git_account = "jekotia"
repo = "jekotia/saturn"
branch = "master"
webhook_enabled = false
run_directory = "docker/stacks/radarr/"
file_paths = [
  "compose.yaml",
  "../../networks/proxy_private.yaml",
  "../../volumes/smb-multimedia.yaml"
]
environment = """
TIMEZONE=[[TIMEZONE]]

# RADARR_URL_PREFIX=
NETWORK_DOMAIN=[[NETWORK_DOMAIN]]

RADARR_DISCORD_WEBHOOK=[[RADARR_DISCORD_WEBHOOK]]

MULTIMEDIA_HOST=[[MULTIMEDIA_HOST]]
MULTIMEDIA_USER=[[MULTIMEDIA_USER]]
MULTIMEDIA_PASS=[[MULTIMEDIA_PASS]]

# UID=
# GID=
"""