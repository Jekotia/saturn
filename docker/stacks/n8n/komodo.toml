[[stack]]
name = "n8n"
tags = ["automation"]
[stack.config]
server = "hyperion"
links = [
  "https://n8n.jekotia.net",
  "https://github.com/n8n-io/n8n",
  "https://github.com/n8n-io/n8n/pkgs/container/n8n",
  "https://github.com/n8n-io/runners/pkgs/container/runners",
  "https://github.com/n8n-io/n8n-sandbox-service-api/pkgs/container/n8n-sandbox-service-api",
  "https://github.com/n8n-io/n8n-sandbox-service-runner-dind/pkgs/container/n8n-sandbox-service-runner-dind",
  "https://github.com/searxng/searxng/pkgs/container/searxng"
]
git_account = "jekotia"
repo = "jekotia/saturn"
branch = "master"
webhook_enabled = false
run_directory = "docker/stacks/n8n/"
file_paths = [
  "compose.yaml",
  "app.yaml",
  "runners.yaml",
  "sandbox-api.yaml",
  "sandbox-certs.yaml",
  "sandbox-runner-1.yaml",
  "searxng.yaml",
  "../../networks/proxy_private.yaml"
]
environment = """
TIMEZONE=[[TIMEZONE]]

# N8N_URL_PREFIX=
NETWORK_DOMAIN=[[NETWORK_DOMAIN]]

# n8n version - get the version number of the latest stable release from https://github.com/n8n-io/n8n/releases
N8N_VERSION=2.49.5

# Sandbox service version - the API, runner, and sandbox images share one release.
# Get the number of the latest stable "service" release (not a staging prerelease) from https://github.com/n8n-io/n8n-sandbox-service/releases
N8N_SANDBOX_VERSION=1.16.0

# n8n task runner authentication. Use a random secret you generate.
N8N_RUNNERS_AUTH_TOKEN=[[N8N_RUNNERS_AUTH_TOKEN]]

# Sandbox service secrets — pick your own values
SANDBOX_API_KEYS=[[N8N_SANDBOX_API_KEYS]]
SANDBOX_RUNNER_REGISTRATION_TOKEN=[[N8N_SANDBOX_RUNNER_REGISTRATION_TOKEN]]
SANDBOX_API_RUNNER_REGISTRATION_TOKEN=[[N8N_SANDBOX_API_RUNNER_REGISTRATION_TOKEN]]
SANDBOX_RUNNER_API_KEYS=[[N8N_SANDBOX_RUNNER_API_KEYS]]

# Must match a value in SANDBOX_API_KEYS above — this is how n8n authenticates to the sandbox
N8N_SANDBOX_SERVICE_API_KEY=[[N8N_SANDBOX_API_KEYS]]

# Web search: secret for the bundled SearXNG instance — pick your own value
SEARXNG_SECRET=[[N8N_SEARXNG_SECRET]]
N8N_INSTANCE_AI_SEARXNG_URL=http://searxng:8080
"""