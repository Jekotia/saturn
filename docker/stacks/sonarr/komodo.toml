[[stack]]
name = "sonarr"
tags = [
  "media-management",
  "smb-mounts"
]
[stack.config]
server = "hyperion"
links = [
  "https://sonarr.jekotia.net",
  "https://github.com/linuxserver/docker-sonarr",
  "https://github.com/linuxserver/docker-sonarr/pkgs/container/sonarr"
]
git_account = "jekotia"
repo = "jekotia/saturn"
branch = "master"
webhook_enabled = false
run_directory = "docker/stacks/sonarr/"
file_paths = [
  "compose.yaml",
  "../../networks/proxy_private.yaml",
  "../../volumes/smb-multimedia.yaml"
]
environment = """
TIMEZONE=[[TIMEZONE]]

# SONARR_URL_PREFIX=
NETWORK_DOMAIN=[[NETWORK_DOMAIN]]

SONARR_DISCORD_WEBHOOK=[[SONARR_DISCORD_WEBHOOK]]

MULTIMEDIA_HOST=[[MULTIMEDIA_HOST]]
MULTIMEDIA_USER=[[MULTIMEDIA_USER]]
MULTIMEDIA_PASS=[[MULTIMEDIA_PASS]]

# UID=
# GID=
"""